<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10151a" />
    <meta name="description" content="World RPG 合成配方查詢" />
    <title>World RPG · 配方典藏</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-glow" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="#" aria-label="返回配方典藏首頁" data-i18n-aria-label="brandLabel">
        <span class="brand-mark">W</span>
        <span><strong>WORLD RPG</strong><small>CRAFTING ARCHIVE</small></span>
      </a>
      <div class="header-actions">
        <p class="header-note" data-i18n="headerNote">探索每一件裝備的鍛造之路</p>
        <div class="language-switcher" aria-label="語言切換" data-i18n-aria-label="languageLabel">
          <button class="language-button is-active" type="button" data-locale="traditional">繁體</button>
          <button class="language-button" type="button" data-locale="simplified">簡體</button>
        </div>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow" data-i18n="eyebrow">冒險者工坊</p>
        <h1 id="page-title" data-i18n="pageTitle">配方典藏</h1>
        <p class="hero-copy" data-i18n="heroCopy">從材料到傳說裝備，快速查找你需要的合成路線。</p>
        <div class="search-panel">
          <label class="search-box" for="search-input">
            <span aria-hidden="true">⌕</span>
            <input id="search-input" type="search" placeholder="搜尋裝備、材料或物品代碼…" data-i18n-placeholder="searchPlaceholder" autocomplete="off" />
            <button id="clear-search" type="button" aria-label="清除搜尋" data-i18n-aria-label="clearSearch">×</button>
          </label>
          <div class="quick-filters" aria-label="快速篩選" data-i18n-aria-label="quickFilters">
            <button class="filter-chip is-active" type="button" data-filter="all" data-i18n="allRecipes">全部配方</button>
            <button class="filter-chip" type="button" data-filter="alternate" data-i18n="alternateRecipes">多種配方</button>
            <button class="filter-chip" type="button" data-filter="materials" data-i18n="threeMaterials">三種材料</button>
          </div>
        </div>
      </section>

      <section class="catalog" aria-label="配方目录">
        <aside class="browse-panel">
          <div class="panel-heading">
            <div>
              <p class="section-kicker" data-i18n="browseByOutput">按成品瀏覽</p>
              <h2 data-i18n="equipmentCatalog">裝備目錄</h2>
            </div>
            <span id="output-count" class="count-badge">—</span>
          </div>
          <label class="browse-search" for="output-filter">
            <span aria-hidden="true">⌕</span>
            <input id="output-filter" type="search" placeholder="篩選成品…" data-i18n-placeholder="outputPlaceholder" autocomplete="off" />
          </label>
          <nav id="output-list" class="output-list" aria-label="可製作物品列表" data-i18n-aria-label="outputListLabel"></nav>
        </aside>

        <section class="recipes-panel" aria-live="polite">
          <div class="results-header">
            <div>
              <p class="section-kicker" data-i18n="craftingRecipes">鍛造配方</p>
              <h2 id="results-title">全部配方</h2>
            </div>
            <p id="results-count" class="results-count">正在载入…</p>
          </div>
          <div id="active-filter" class="active-filter" hidden>
            <span></span><button type="button" data-i18n="viewAll">查看全部</button>
          </div>
          <div id="recipe-grid" class="recipe-grid"></div>
          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-icon">◇</div>
            <h3 data-i18n="noRecipes">沒有找到匹配的配方</h3>
            <p data-i18n="noRecipesHelp">試試不同的物品名稱、材料名稱或物品代碼。</p>
            <button id="reset-filters" class="button-secondary" type="button" data-i18n="resetFilters">重置篩選</button>
          </div>
          <div id="error-state" class="empty-state" hidden>
            <div class="empty-icon">!</div>
            <h3 data-i18n="loadError">配方資料無法載入</h3>
            <p data-i18n="loadErrorHelp">請透過本地伺服器開啟網站，而不是直接雙擊 HTML 文件。</p>
          </div>
        </section>
      </section>
    </main>

    <footer>
      <span data-i18n="footerTitle">WORLD RPG · 配方資料庫</span>
      <span id="footer-stats" data-i18n="loadingRecipes">讀取配方中…</span>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
